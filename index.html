/* ===== الثيم الفاتح — الصقه كاملاً داخل <style> جديد قبل </head> ===== */
:root{
  --gold:#B08944; --gold-l:#8A6A32; --gold-d:#8A6A32;
  --dark:#FAF7F0; --dark2:#F3EEE3; --dark3:#FFFFFF; --dark4:#F6F1E6;
  --card:#FFFFFF; --text:#2B2418; --muted:#8A7F6C;
  --green:#2E9E5B; --red:#D14343;
  --border:rgba(176,137,68,.18);
  --line:#E6DDCB;
}
body{background:var(--dark);color:var(--text)}

/* Hero */
.hero{background:radial-gradient(ellipse 80% 70% at 50% -10%,rgba(176,137,68,.22) 0%,transparent 70%),linear-gradient(180deg,#FFF9EC 0%,var(--dark) 100%);border-bottom:1px solid var(--line)}
.hero::before{background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(176,137,68,.06) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(176,137,68,.06) 40px)}

/* الفلاتر والترتيب */
.filter-bar{background:rgba(250,247,240,.92);border-bottom:1px solid var(--line)}
.srch{background:#fff;border-color:var(--line);color:var(--text)}
.fbtn,.sort-btn{border-color:var(--line);background:#fff}
.fbtn.on{color:#fff}
.fbtn:hover:not(.on){border-color:var(--gold);color:var(--gold-d)}
.sort-btn.on{background:rgba(176,137,68,.12);color:var(--gold-d);border-color:rgba(176,137,68,.4)}
.sort-btn:hover:not(.on){border-color:var(--gold);color:var(--text)}

/* البطاقات */
.pcard{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,20,.06)}
.pcard:hover{box-shadow:0 14px 36px rgba(138,106,50,.18);border-color:rgba(176,137,68,.45)}
.pcard.in-cart{border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(176,137,68,.25)}
.img-wrap{background:#F3EEE3}
.no-img{color:#D9CEB8}
.pcard.unavail .img-wrap::after{background:rgba(255,255,255,.72)}
.multi-badge{background:rgba(255,255,255,.9);color:var(--gold-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.unit-badge{background:rgba(255,255,255,.92);border-color:rgba(176,137,68,.4);color:var(--gold-d)}
.avail-badge.yes{background:rgba(232,247,238,.95);color:#1F7A44;border-color:rgba(46,158,91,.3)}
.avail-badge.no{background:rgba(253,236,236,.95);color:#B03030;border-color:rgba(209,67,67,.3)}
.cart-count-badge{color:#fff}
.cprice-unit{color:var(--gold-d)}
.cfoot{border-top-color:var(--line)}
.add-cart-btn{background:rgba(176,137,68,.1);border-color:rgba(176,137,68,.35)}
.add-cart-btn:hover{background:var(--gold);color:#fff}
.add-cart-btn.in{background:rgba(46,158,91,.1);border-color:rgba(46,158,91,.35);color:#1F7A44}
.add-cart-btn.disabled{background:#F3EEE3;border-color:var(--line);color:#B5AA94}

/* التحميل والفراغ والخطأ */
.spinner{border-color:var(--line);border-top-color:var(--gold)}
.empty-state p{color:var(--muted)}
.retry-btn,.cart-fab,.wa-btn.add-list{color:#fff}
.footer{background:var(--dark2);border-top:1px solid var(--line)}
.cart-fab{box-shadow:0 8px 28px rgba(176,137,68,.4)}
.cart-fab-badge{background:#fff;color:var(--gold-d)}

/* النافذة المنبثقة */
.modal-overlay,.cart-panel-overlay{background:rgba(60,45,20,.45)}
.modal{background:#fff;border-color:var(--line);box-shadow:0 24px 70px rgba(60,45,20,.25)}
.modal-close,.cart-close-btn,.lb-x,.lb-btn{background:#fff;border:1px solid var(--line);color:var(--text)}
.modal-gallery{background:#F3EEE3}
.modal-gallery .no-img-big{color:#D9CEB8}
.mg-btn{background:rgba(255,255,255,.9);border-color:var(--line);color:var(--text)}
.mg-counter{background:rgba(255,255,255,.92);color:var(--gold-d)}
.mg-dot{background:rgba(0,0,0,.2)}
.modal-sku{color:#A89C84}
.modal-desc{color:#6B604D}
.modal-divider{background:var(--line)}
.detail-item,.qty-row{background:var(--dark4)}
.modal-unit-price{color:var(--gold-d)}
.modal-avail.yes{background:rgba(232,247,238,.95);color:#1F7A44}
.modal-avail.no{background:rgba(253,236,236,.95);color:#B03030}
.unit-info-box{background:rgba(176,137,68,.08);border-color:rgba(176,137,68,.3)}
.uib-val{color:var(--gold-d)}
.qty-ctrl{border-color:var(--line)}
.qty-btn{background:#fff}
.qty-val{background:var(--dark4);border-color:var(--line)}
.calc-row{background:rgba(176,137,68,.06);border-color:rgba(176,137,68,.25)}
.calc-sep{color:#CDBF9F}
.wa-btn.secondary{background:#fff;border-color:var(--line);color:var(--muted)}
.wa-btn.disabled-btn{background:#F3EEE3;border-color:var(--line);color:#B5AA94}

/* العارض (Lightbox) */
.lb{background:rgba(250,247,240,.97)}
.lb-info{color:var(--gold-d)}
.dot{background:#D9CEB8}

/* السلة */
.cart-panel{background:#fff;border-right-color:var(--line)}
.cart-header,.customer-form{border-color:var(--line)}
.customer-form{background:var(--dark4)}
.cust-inp{background:#fff;border-color:var(--line);color:var(--text)}
.cust-inp::placeholder{color:#B5AA94}
.cart-item{border-bottom-color:var(--line)}
.ci-img,.ci-img-placeholder{background:var(--dark4)}
.ci-sku{color:#A89C84}
.ci-unit-row{background:rgba(176,137,68,.1);color:var(--gold-d)}
.ci-pcs-total{color:#9A8F7A}
.ci-qty-btn{background:var(--dark4);border-color:var(--line)}
.cart-footer{background:var(--dark2);border-top-color:var(--line)}
.cs-total-row{border-top-color:var(--line)}
.cart-clear-btn{border-color:var(--line);color:var(--muted)}
.toast{background:#fff;color:var(--text);border-color:rgba(176,137,68,.4);box-shadow:0 8px 24px rgba(60,45,20,.2)}
